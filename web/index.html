<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SparkGap Web</title>
<link rel="icon" href="icons/sparkgap.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span>SparkGap</div>
    <select id="bandSel" class="bandsel" title="Server and band" hidden></select>
    <div class="search">
      <input id="search" type="text" placeholder="Call or kHz" autocomplete="off" spellcheck="false">
      <div id="matches" class="matches" hidden></div>
    </div>
    <div class="grow"></div>
    <div id="station" class="station mono"></div>
    <div class="state"><span id="stateDot" class="sdot"></span><span id="stateText">No feed</span></div>
    <div id="rec" class="rec" hidden><span class="rdot"></span>REC</div>
    <button id="gear" class="icon" title="Settings and info">⚙</button>
  </header>

  <main>
    <section class="panel spectrum">
      <div id="ladder" class="ladder">
        <canvas id="ticks"></canvas>
        <div id="chips"></div>
      </div>
      <div id="wfbox" class="wfbox">
        <canvas id="wf"></canvas>
        <div id="wfmsg" class="wfmsg"></div>
      </div>
      <div id="fscroll" class="fscroll"><div id="fspace"></div></div>
    </section>

    <aside class="side">
      <section class="panel detail">
        <div class="dhead">
          <div class="drow">
            <span id="dTitle" class="dtitle mono">Pick a signal</span>
            <span id="dPill" class="pill" hidden></span>
            <span class="grow"></span>
            <span id="utc" class="label"></span>
          </div>
          <div class="stats">
            <div class="stat"><div class="label">KHZ</div><div id="dKhz" class="mono">-</div></div>
            <div class="stat"><div class="label">WPM</div><div id="dWpm" class="mono">-</div></div>
            <div class="stat"><div class="label">SNR</div><div id="dSnr" class="mono">-</div></div>
          </div>
        </div>
        <div class="dlabel dcopy"><span class="label">DECODED WINDOWS</span><button id="dCopy" class="btn small" hidden>Copy</button></div>
        <div id="dNote" class="note" hidden></div>
        <div id="dWins" class="wins"></div>
      </section>
      <section class="panel zoom">
        <div class="zgrid">
          <span class="zl">Zoom</span>
          <input id="span" type="range" min="2" max="48" step="any">
          <button id="full" class="btn small">Full</button>
          <span class="zl">Span</span>
          <div id="range" class="mono small muted"></div>
          <span id="spanText" class="mono small"></span>
          <span class="zl snr">SNR</span>
          <div class="zsnr">
            <div class="legend"></div>
            <div class="legendText mono"><span>0</span><span>10</span><span>20</span><span>30</span></div>
          </div>
          <span class="zunit mono">dB</span>
        </div>
      </section>
    </aside>
  </main>

  <footer id="statusbar"></footer>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog settings" role="dialog" aria-label="Settings">
    <div class="shead"><div id="modeSeg" class="seg"></div><div id="setNote" class="small muted"></div></div>
    <div id="tabs" class="tabs"></div>
    <div id="infoBody" class="status" hidden></div>
    <div id="tabServers">
      <div id="conns" class="scards"></div>
      <div id="connForm" class="form" hidden>
        <input id="fAddr" type="text" placeholder="Address of the SparkGap server (VPN or local IP)" spellcheck="false">
        <input id="fCode" type="text" placeholder="Its join code, e.g. XXX-XXX" spellcheck="false">
        <div id="fErr" class="err" hidden></div>
        <div class="row"><button id="fSave" class="btn">Add</button><button id="fCancel" class="btn">Cancel</button></div>
      </div>
      <button id="addConn" class="btn">+ Add server</button>
      <section class="scard wide browser"><h3><span>THIS BROWSER</span></h3>
        <div class="grid seatgrid">
          <span class="label">THEME</span><div id="themeSeg" class="seg"></div>
          <span class="label">DECODED</span><div id="decSeg" class="seg"></div>
          <span></span><span class="small faint">Readings of each decoded window shown.</span>
        </div>
      </section>
    </div>
    <div id="tabCopy" class="scards" hidden></div>
    <div class="row foot"><span class="small faint"><a id="help" target="_blank" rel="noopener">Help</a></span><button id="close" class="btn">Close</button></div>
  </div>
</div>
</body>
</html>
