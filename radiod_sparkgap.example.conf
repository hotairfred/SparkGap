# ka9q-radio radiod config for SparkGap on an RX888 (hotairfred/SparkGap#146).
# Install as /etc/radio/radiod@sparkgap.conf, start with: sudo systemctl start radiod@sparkgap
# SparkGap (skimmer_rtp.example.json) joins the data group and picks each band by SSRC, which
# radiod sets to the channel frequency in kHz: keep freq below in step with SparkGap's band centres.
#
# Setup notes (tested 11-07 on Ubuntu 24.04 with radiod's signal generator):
# - SparkGap on the same computer: set ttl = 0 in [global] (the streams stay on this machine),
#   turn on multicast on loopback (sudo ip link set dev lo multicast on, or the set_lo_multicast
#   service ka9q-radio installs) and set SparkGap's rtp_iface to 127.0.0.1.
# - Numeric multicast groups (data = 239.101.2.1) work without Avahi .local name lookups.
# - Raise the socket buffer limit, or busy bands lose packets: net.core.rmem_max = 16777216
#   in /etc/sysctl.d/ (SparkGap warns when the kernel caps its buffer).
# - radiod does not stop on SIGTERM: stop it with systemctl, or kill -9.
# - FFTW wisdom cuts radiod's CPU by about a third (0.44 -> 0.30 cores on an i7-9700K with 9 channels):
#   sudo fftwf-wisdom -v -T 1 -o /var/lib/ka9q-radio/wisdom rof1620000 cob4800   (about 15 min, once;
#   the sizes are for samprate 64m8 and 192k channels with radiod's default 20 ms blocks, see
#   ka9q-radio's docs/FFTW3.md). radiod logs "import ... succeeded" when it finds it.
# - Check the level before trusting gain: metadump --ssrc 0 --count 3 <status group> shows the front
#   end's "IF pwr" (about -28 dBFS here at gain 20) and "A/D overrange" (keep it at 0 through the
#   evening's strongest broadcasters; lower gain if it climbs).

[global]
hardware = rx888
status = sparkgap-status.local     # radiod status and control
data = sparkgap-iq.local           # SparkGap's rtp_group
samprate = 192k
ttl = 0                            # SparkGap on this computer; 1 to send the channels to the LAN

[rx888]
device = "rx888"
description = "SparkGap skimmer"
gain = 20                          # fixed front-end gain, dB: set for the antenna, then leave it
# reference = 27e6                 # clock: scale by (1 + ppm / 1e6) to correct a measured offset
#                                  # (SparkGap's ppm_offset is the other place to correct it)

[skimmer]
mode = iq
samprate = 192k
low = -95k
high = +95k
encoding = f32                     # SparkGap rtp_encoding f32le
agc = 0                            # no AGC: the decoders need the envelope linear
gain = 0                           # fixed channel gain, dB
# One channel per band, at SparkGap's band centres for "160m" ... "10m" at 192 kHz (each band's
# lower CW edge + 76.8 kHz, sparkgap.band_center_hz); SSRC = round(kHz): 1887 3577 7077 ...
freq = "1m886800 3m576800 7m076800 10m176800 14m076800 18m144800 21m076800 24m966800 28m076800"
