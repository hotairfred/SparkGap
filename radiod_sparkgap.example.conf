# ka9q-radio radiod config for SparkGap on an RX888 (hotairfred/SparkGap#146).
# Install as /etc/radio/radiod@sparkgap.conf, start with: sudo systemctl start radiod@sparkgap
# SparkGap (skimmer_rtp.example.json) joins the data group and picks each band by SSRC, which
# radiod sets to the channel frequency in kHz: keep freq below in step with SparkGap's band centres.

[global]
hardware = rx888
status = sparkgap-status.local     # radiod status and control
data = sparkgap-iq.local           # SparkGap's rtp_group
samprate = 192k

[rx888]
device = "rx888"
description = "SparkGap skimmer"
gain = 20                          # fixed front-end gain, dB: set for the antenna, then leave it
# reference = 27e6                 # clock: scale by (1 + ppm / 1e6) to correct a measured offset
#                                  # (SparkGap's ppm_offset is the other place to correct it)

[skimmer]
mode = iq
samprate = 192k
low = -95k
high = +95k
encoding = f32                     # SparkGap rtp_encoding f32le
agc = 0                            # no AGC: the decoders need the envelope linear
gain = 0                           # fixed channel gain, dB
# One channel per band, at SparkGap's band centres for "160m" ... "10m" at 192 kHz (each band's
# lower CW edge + 76.8 kHz, sparkgap.band_center_hz); SSRC = round(kHz): 1887 3577 7077 ...
freq = "1m886800 3m576800 7m076800 10m176800 14m076800 18m144800 21m076800 24m966800 28m076800"
